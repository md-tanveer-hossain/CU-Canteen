<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CU Tech Canteen</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-red-100 text-black">
    <div class="max-w-md mx-auto p-4 pb-28">
        <h1 class="text-2xl font-bold mb-4 shadow">CU Tech Campus Canteen</h1>

        <!-- 1st Item-->
        <div class="bg-white rounded-xl shadow p-4 mb-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="images/veg-roll.jpg" alt="Veg Roll" class="w-14 h-14 rounded-lg object-cover">
                <div>
                    <h2 class="font-bold text-lg text-green-600">Veg Roll</h2>
                    <p class="text-green-600 font-medium">₹30</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="updateQty('vegroll-qty',-1)" class="bg-gray-200 px-3 py-1 rounded-lg font-bold">-</button>
                <span id="vegroll-qty" class="font-bold">0</span>
                <button onclick="updateQty('vegroll-qty',+1)" class="bg-green-600 text-white px-3 py-1 rounded-lg font-bold">+</button>
            </div>
        </div>

        <!-- 2nd Item-->
        <div class="bg-white rounded-xl shadow p-4 mb-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="images/paneer-roll.jpg" alt="Paneer Roll" class="w-14 h-14 rounded-lg object-cover">
                <div>
                    <h2 class="font-bold text-lg text-green-600">Paneer Roll</h2>
                    <p class="text-green-600 font-medium">₹35</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="updateQty('paneerroll-qty',-1)" class="bg-gray-200 px-3 py-1 rounded-lg font-bold">-</button>
                <span id="paneerroll-qty" class="font-bold">0</span>
                <button onclick="updateQty('paneerroll-qty',+1)" class="bg-green-600 text-white px-3 py-1 rounded-lg font-bold">+</button>
            </div>
        </div>

        <!-- Hidden QR Box (Appears when Pay is clicked) -->
        <div id="qr-box" class="hidden bg-white p-4 rounded-xl shadow-md text-center mb-24 border border-gray-300">
            <p class="font-bold text-lg mb-2">Scan to Pay ₹<span id="qr-amount">0</span></p>
            <img id="qr-image" src="" alt="UPI QR Code" class="mx-auto w-44 h-44 border p-1 rounded-lg">
            <a id="upi-app-link" href="#" class="inline-block mt-3 bg-blue-600 text-white font-bold px-4 py-2 rounded-lg text-sm">
                Open GPay / PhonePe / Paytm
            </a>
            <input id="txn-input" type="text" maxlength="12" oninput="checkTxn()" placeholder="Paste 12-digit UPI Transaction ID" class="mt-3 w-full border border-gray-300 rounded-lg px-3 py-2 text-center text-sm">
        </div>

        <!-- For Added to Cart -->
         <div class="fixed bottom-0 left-0 right-0 p-4 bg-red-100/90 backdrop-blur-sm">
            <div class="max-w-md mx-auto bg-gray-800 text-white rounded-xl shadow-lg p-4 flex justify-between items-center">
            <p class="text-lg font-medium">Total Amount</p>
            <p class="text-xl font-bold">₹<span id="total-amount">0</span></p>
            <button id="order-btn" onclick="placeOrder()" class="hidden bg-green-600 text-white font-bold px-5 py-2 rounded-lg">Order</button>
            <button onclick="showUPI()" class="bg-blue-600 text-white font-bold px-4 py-2 rounded-lg">Pay QR</button>
        </div>

    </div>

    <script>
    let currentOrderId = "";
        
    function updateQty(itemId, change) {
        document.getElementById("qr-box").classList.add("hidden");
        document.getElementById("order-btn").classList.add("hidden");
        // Step 1
        let qtySpan = document.getElementById(itemId);
        let currentQty = parseInt(qtySpan.innerText) + change;
        
        // Step 2
        if(currentQty < 0) {
            currentQty = 0;
        }

        else if(currentQty>3){
            currentQty=3;
        }
        
        // Step 3
        qtySpan.innerText = currentQty;

        // Step 4
        let vegQty = parseInt(document.getElementById("vegroll-qty").innerText);
        let paneerQty = parseInt(document.getElementById("paneerroll-qty").innerText);
        
        let total = (vegQty * 30) + (paneerQty * 35);
        document.getElementById("total-amount").innerText = total;
    }
    function placeOrder() {
        // 1. Grab the final quantities and total from the screen
        let vegQty = parseInt(document.getElementById("vegroll-qty").innerText);
        let paneerQty = parseInt(document.getElementById("paneerroll-qty").innerText);
        let total = parseInt(document.getElementById("total-amount").innerText);
        let txnId = document.getElementById("txn-input").value.trim();

        // 2. Stop if the cart is empty
        if (total === 0) {
            alert("Please add at least one item first!");
            return;
        }

        // 3. Build the receipt text (just like String concatenation in Java/Python)
        let bill = "CU-Canteen Order:\n";
        if (vegQty > 0) {
            bill += "- Veg Roll x" + vegQty + " = ₹" + (vegQty * 30) + "\n";
        }
        if (paneerQty > 0) {
            bill += "- Paneer Roll x" + paneerQty + " = ₹" + (paneerQty * 35) + "\n";
        }
        bill += "Total: ₹" + total;

        // 4. Convert spaces/newlines into URL-safe code and open WhatsApp
        let phone = "917980734030"; // Put your 10-digit number after 91 for testing
        let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(bill+ "\nOrder ID: " + currentOrderId+"\nUPI ID:'''"+txnId+"'''");
        window.open(url, "_blank");
    }
    function showUPI() {
        // 1. Grab the current total
        let total = parseInt(document.getElementById("total-amount").innerText);

        if (total === 0) {
            alert("Add items to your cart first!");
            return;
        }

        let randomNum = Math.floor(Math.random() * 9000) + 1000;
        currentOrderId="CU-"+randomNum;

        // 2. Build the official UPI payment link (put your own UPI ID for testing)
        let upiId = "ghoshrupayan0@oksbi"; 
        let upiLink = "upi://pay?pa=" + upiId + "&pn=CU%20Canteen&am=" + total + "&cu=INR"+ "&cu=INR&tn=" + currentOrderId;

        // 3. Turn that UPI link into a QR image & update the popup
        let qrApi = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(upiLink);
        document.getElementById("qr-image").src = qrApi;
        document.getElementById("qr-amount").innerText = total;
        document.getElementById("upi-app-link").href = upiLink;

        document.getElementById("txn-input").value = "";
        document.getElementById("order-btn").classList.add("hidden");

        // 4. Unhide the QR box by removing Tailwind's "hidden" class
        document.getElementById("qr-box").classList.remove("hidden");
    }

    function checkTxn() {
        let txn = document.getElementById("txn-input").value.trim();
        if (txn.length === 12) {
            document.getElementById("order-btn").classList.remove("hidden");
        } else {
            document.getElementById("order-btn").classList.add("hidden");
        }
        }
</script>
</body>
</html>
